services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: remstroy-rag
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ROUTERAI_API_KEY=${ROUTERAI_API_KEY}
      - CHAT_MODEL=${CHAT_MODEL:-deepseek/deepseek-v4.1-flash}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen/qwen3-embedding-8b}
      - PORT=8000
      - CHROMA_PATH=/app/chroma_db
    volumes:
      - chroma_data:/app/chroma_db
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  chroma_data:
    driver: local
